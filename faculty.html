<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Period Pass — Instructor</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<style>
  :root { --ink:#1a1a1a; --muted:#5b5b5b; --line:#e2e2e2; --bg:#fbfbfa; --accent:#0b5fff;
          --normal:#2e9e5b; --medium:#d9a406; --high:#e2711d; --critical:#cf3025; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,
         BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         padding:20px calc(16px + env(safe-area-inset-left)) 40px; }
  .wrap { max-width:960px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  .hidden { display:none !important; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  select { font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:8px;
           background:#fff; min-width:190px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px;
          margin-bottom:14px; }
  .card h2 { font-size:15px; margin:0 0 2px; }
  .card .why { color:var(--muted); font-size:12.5px; margin:0 0 12px; }
  .panels { display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:760px) { .panels { grid-template-columns:1fr 1fr; } }
  .bars { display:flex; align-items:flex-end; gap:2px; height:130px; margin-top:8px; }
  .bars div { flex:1; background:var(--accent); min-height:1px; border-radius:2px 2px 0 0; }
  .axis { display:flex; justify-content:space-between; color:var(--muted); font-size:11px;
          margin-top:4px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-weight:600; color:var(--muted); font-size:12px;
       border-bottom:1px solid var(--line); padding:6px 8px; }
  td { padding:9px 8px; border-bottom:1px solid #f0f0f0; vertical-align:top; }
  tr.flagged { cursor:pointer; }
  tr.flagged:hover { background:#f7f9ff; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
  .normal{background:var(--normal)} .medium{background:var(--medium)}
  .high{background:var(--high)} .critical{background:var(--critical)}
  .detail td { color:var(--muted); font-size:13px; background:#fafbfe; }
  .muted { color:var(--muted); }
  .warn { background:#fff8e6; border-color:#f0dca0; }
  #signin { text-align:center; padding:60px 0; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Instructor</h1>
  <p class="sub">Your courses only. Sign in with your institute account.</p>

  <div id="signin"><div id="gsiBtn"></div><p id="signinError" class="hidden muted"></p></div>

  <div id="app" class="hidden">
    <div class="bar">
      <select id="course" autocomplete="off"></select>
      <select id="who" autocomplete="off"></select>
    </div>
    <div id="body"></div>
  </div>

</div>
<script>
(function () {
  'use strict';
  // window.PASS_CONFIG — the name config.js actually defines. This read PERIOD_PASS_CONFIG,
  // a name that exists nowhere, so CFG fell back to {} and Google Identity was handed
  // client_id: undefined. The `|| {}` is what made that fail as "Error 400: invalid_request"
  // from Google rather than as a legible error here; the check below closes that gap.
  var CFG = window.PASS_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  // `started` lives beside onCredential, not here — an earlier edit left a second unused copy
  // on `state`, which is exactly the sort of thing that makes a guard look present twice and
  // implemented neither time.
  //
  // `seq` numbers every panel load. A response only paints if it is still the newest request:
  // switching volunteer, or volunteer then All students, fires two fetches, and Apps Script
  // does not guarantee they return in order. Without this the slower first response repaints
  // over the second — the panel showing correct content, then replacing it with stale content,
  // which looks exactly like an unexplained reload.
  var state = { idToken: null, course: null, seq: 0 };

  // Same shape as pass.js: text/plain avoids a CORS preflight, which Apps Script cannot answer.
  // Counts and names every call, so a duplicate can be identified rather than guessed at.
  // Three are expected at startup: facultyCourses, facultyVolunteers, facultyStudents. A fourth
  // line here says which action repeated, which is the one fact the network tab cannot give —
  // every request looks identical there, because Apps Script answers each POST with a 302 to
  // the same /echo endpoint.
  //
  // console.debug, not console.log: invisible unless the level is turned up, so it costs
  // nothing in normal use and is there when it is needed.
  var apiCalls = 0;
  function api(payload) {
    apiCalls++;
    try {
      console.debug('[period-pass] #' + apiCalls + ' ' + payload.action +
        (payload.course ? ' course=' + payload.course : '') +
        (payload.volunteer ? ' volunteer=' + payload.volunteer : ''));
    } catch (e) {}
    payload.idToken = state.idToken;
    return fetch(CFG.EXEC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  // --------------------------------------------------------------------------
  // Histograms
  //
  // Drawn WITHOUT a threat level, and that is not an oversight. Neither of these has a measured
  // threshold: the photo-response one has never been calibrated against real volunteers, and the
  // scan timeline has no detector behind it at all — the agreed answer to a volunteer working a
  // stack of passes at their desk is an unannounced check of their phone, and this chart exists
  // to say when to run one. A colour here would be a confident accusation with nothing behind
  // it, and an instructor shown a colour acts on the colour.
  // --------------------------------------------------------------------------
  function histogram(counts, labels) {
    var max = Math.max.apply(null, counts.concat([1]));
    var bars = counts.map(function (c) {
      return '<div style="height:' + Math.round((c / max) * 100) + '%" title="' + c + '"></div>';
    }).join('');
    return '<div class="bars">' + bars + '</div><div class="axis"><span>' +
      esc(labels[0]) + '</span><span>' + esc(labels[1]) + '</span></div>';
  }

  function taView(d) {
    var lat = d.photoLatency, tl = d.scanAligned || d.scanTimeline;
    var firsts = (tl.firstScanMinutes || []);
    var html =
      '<div class="panels">' +
        '<div class="card"><h2>Photo check response times</h2>' +
          '<p class="why">' + lat.checks + ' checks over ' + d.meetings + ' meetings. ' +
          'Unscored — no threshold has been measured. The left-most bar is under half a ' +
          'second, which is faster than looking at a face allows.</p>' +
          histogram(lat.counts, ['0s', '30s+']) +
        '</div>' +
        '<div class="card"><h2>When scans happen</h2>' +
          '<p class="why">Minutes from this volunteer\u2019s first scan of each meeting, summed ' +
          'over ' + tl.meetings + '. A second cluster later on is worth a look \u2014 it is ' +
          'the shape of passes worked through at a desk. No threshold: use it to decide when ' +
          'to ask for the phone.</p>' +
          histogram(tl.counts.slice(0, 60), ['start', '60 min']) +
          (firsts.length ? '<p class="why">First scan each meeting, minutes in: ' +
            esc(firsts.join(', ')) + '</p>' : '') +
        '</div>' +
      '</div>';

    if (d.plants && d.plants.total) {
      html += '<div class="card' + (d.plants.total > d.plants.looked ? ' warn' : '') + '">' +
        '<h2>Planted checks</h2><p class="why">Looked properly at ' + d.plants.looked +
        ' of ' + d.plants.total + '. Counts, not a rate \u2014 one missed plant means little, ' +
        'because two students on a course can genuinely resemble each other.</p></div>';
    }

    html += '<div class="card"><h2>Flags</h2>';
    if (!d.flags.length) {
      html += '<p class="why">None. Levels come only from the risk evaluation, which has ' +
              'arithmetic behind it \u2014 unlike the charts above.</p>';
    } else {
      html += '<table><tr><th></th><th>Level</th><th>Why</th><th>Raised</th></tr>' +
        d.flags.map(function (f) {
          return '<tr><td><span class="dot ' + esc(f.level) + '"></span></td><td>' +
            esc(f.level) + '</td><td>' + esc(f.why) + '</td><td class="muted">' +
            esc(f.at) + '</td></tr>';
        }).join('') + '</table>';
    }
    return html + '</div>';
  }

  function studentsView(d) {
    var rows = d.students.map(function (s, i) {
      // Attendance is null when the register has not been rolled up. Showing 0% there would
      // read as "attended nothing", which is a different and alarming claim.
      var att = s.attendancePct === null || s.attendancePct === undefined
        ? '<span class="muted">not rolled up</span>'
        : s.attendancePct + '% <span class="muted">(' + s.present + '/' + s.held + ')</span>';
      var flagged = s.level && s.level !== 'normal';
      return '<tr class="' + (flagged ? 'flagged' : '') + '" data-i="' + i + '">' +
        '<td><span class="dot ' + esc(s.level) + '"></span>' + esc(s.roll) + '</td>' +
        '<td>' + esc(s.name) + '</td><td>' + att + '</td></tr>' +
        (flagged ? '<tr class="detail hidden" id="d' + i + '"><td colspan="3">' +
          esc(s.why) + (s.volunteer ? ' \u2014 volunteer: ' + esc(s.volunteer) : '') +
          '</td></tr>' : '');
    }).join('');

    return '<div class="card"><h2>Students</h2>' +
      '<p class="why">Green normal, amber medium, orange high, red critical. Click a flagged ' +
      'row for the reason it was raised \u2014 the reason is the finding, not the colour.</p>' +
      '<table><tr><th>Roll</th><th>Name</th><th>Attendance</th></tr>' + rows + '</table></div>';
  }

  function show(html) { $('body').innerHTML = html; }


  // Bound ONCE, here, not inside the load path.
  //
  // It used to be added after every fetch of the student list, on a #body element that show()
  // empties but never replaces — so the listeners accumulated. Choosing "All students" three
  // times left three handlers on one row, and a click toggled the detail open, shut and open
  // again. Delegation from a container that outlives its contents has to be attached once.
  $('body').addEventListener('click', function (e) {
    var tr = e.target.closest && e.target.closest('tr.flagged');
    if (!tr) return;
    var d = $('d' + tr.getAttribute('data-i'));
    if (d) d.classList.toggle('hidden');
  });

  function load() {
    var who = $('who').value;
    try { console.debug('[period-pass] load() who=' + who); } catch (e) {}
    var mine = ++state.seq;
    // Stale responses are dropped rather than painted. Nothing cancels an in-flight fetch, so
    // this is the only thing standing between a slow earlier reply and it overwriting a newer
    // one after the fact.
    var fresh = function () { return mine === state.seq; };

    show('<p class="muted">Loading\u2026</p>');
    if (who === '__students') {
      api({ action: 'facultyStudents', course: state.course }).then(function (r) {
        if (!fresh()) return;
        if (!r.ok) return show('<p class="muted">' + esc(r.message) + '</p>');
        show(studentsView(r));
      });
    } else {
      api({ action: 'facultyTaDetail', course: state.course, volunteer: who })
        .then(function (r) {
          if (!fresh()) return;
          show(r.ok ? taView(r) : '<p class="muted">' + esc(r.message) + '</p>');
        });
    }
  }

  function loadWho() {
    try { console.debug('[period-pass] loadWho()'); } catch (e) {}
    api({ action: 'facultyVolunteers', course: state.course }).then(function (r) {
      var opts = '<option value="__students">All students</option>';
      if (r.ok) {
        opts += r.volunteers.map(function (v) {
          return '<option value="' + esc(v.volunteer) + '">' + esc(v.volunteer) +
            (v.level !== 'normal' ? ' \u2014 ' + esc(v.level) : '') + '</option>';
        }).join('');
      }
      // Assigned BEFORE the handler is attached, so replacing the options cannot leave a
      // half-built select visible while a load is already running against it.
      $('who').innerHTML = opts;
      $('who').onchange = load;
      load();
    });
  }

  function start() {
    try { console.debug('[period-pass] start()'); } catch (e) {}
    api({ action: 'facultyCourses' }).then(function (r) {
      if (!r.ok) {
        $('signin').classList.remove('hidden');
        $('signinError').textContent = r.message || 'Not listed as faculty for any course.';
        $('signinError').classList.remove('hidden');
        return;
      }
      $('signin').classList.add('hidden');
      $('app').classList.remove('hidden');
      $('course').innerHTML = r.courses.map(function (c) {
        return '<option value="' + esc(c.code) + '">' + esc(c.code) +
          (c.title ? ' \u2014 ' + esc(c.title) : '') + '</option>';
      }).join('');
      // Read the select AFTER the options exist, rather than assuming the first one.
      //
      // Chrome restores a previously selected value once the options are in place, and that
      // restoration fires a real `change` event. Assuming courses[0] meant state.course said
      // CY104L while the select said PH104L; the restoration then fired change, the handler
      // reloaded everything, and the page fetched volunteers and students twice — the second
      // pair being what looked like the list reloading after it had already appeared.
      state.course = $('course').value || r.courses[0].code;

      $('course').onchange = function () {
        // Idempotent. A change event that does not change anything must not cost two requests,
        // whatever fired it — restoration, autofill, or a browser reissuing form state on
        // back-navigation. Cheaper and more robust than trying to suppress the event.
        if (this.value === state.course) return;
        state.course = this.value;
        loadWho();
      };
      // `who`'s handler is attached in loadWho, next to the options it belongs with. Assigning
      // it here as well was harmless — assignment overwrites rather than accumulating, unlike
      // addEventListener — but two lines claiming the same responsibility is how one of them
      // ends up edited and the other forgotten.
      loadWho();
    });
  }

  // Google Identity can call this more than once for a single visit — auto_select fires it on
  // load, and One Tap can fire it again. Each call re-ran start(), which re-fetched the course
  // list, re-bound the dropdowns and re-loaded the panel: the list visibly reloading two or
  // three times for no reason the operator could see.
  //
  // The token is always taken, because a later credential is the fresher one. Only the page
  // build is guarded.
  var started = false;
  function onCredential(resp) {
    try { console.debug('[period-pass] credential callback, started=' + started); } catch (e) {}
    state.idToken = resp.credential;
    if (started) return;
    started = true;
    start();
  }

  function initGsi() {
    // Say what is wrong HERE. Without this, a missing or misnamed config surfaces as a Google
    // error page about an invalid request, which sends the reader to Cloud Console to hunt an
    // origin or consent problem that does not exist.
    if (!CFG.CLIENT_ID || !CFG.EXEC_URL) {
      $('signinError').textContent =
        'config.js did not load, or is missing CLIENT_ID / EXEC_URL. This page cannot sign ' +
        'in until it does \u2014 check config.js sits beside this file on the server.';
      $('signinError').classList.remove('hidden');
      return;
    }
    if (!window.google || !google.accounts || !google.accounts.id) {
      setTimeout(initGsi, 200);
      return;
    }
    try {
      google.accounts.id.initialize({
        client_id: CFG.CLIENT_ID, callback: onCredential, auto_select: true
      });
      google.accounts.id.renderButton($('gsiBtn'),
        { theme: 'filled_blue', size: 'large', text: 'signin_with', width: 260 });
    } catch (e) {
      $('signinError').textContent = 'Sign-in could not start. Tell the office.';
      $('signinError').classList.remove('hidden');
    }
  }

  initGsi();
})();
</script>
</body>
</html>
